# Local Redis configuration reference for ZYND development
#
# Default connection (used across Backend, Web, Admin .env files):
#   REDIS_URL=redis://localhost:6379/0
#
# Backend DB allocation:
#   DB 0 — default / general
#   DB 1 — sessions  (REDIS_SESSION_DB)
#   DB 2 — cache    (REDIS_CACHE_DB)
#   DB 3 — events   (REDIS_EVENT_STREAM_DB)
#
# Start Redis locally (macOS Homebrew):
#   brew services start redis
#
# Or run in foreground:
#   redis-server

bind 127.0.0.1
port 6379
databases 16
